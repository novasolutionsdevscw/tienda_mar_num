<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nueva Venta | Tienda Mar &amp; Num</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

/* ==========================================================================
   1. VARIABLES Y RESET
   ========================================================================== */
:root{
  --linen:#F5F1EA;
  --khaki:#D7C9B8;
  --camel:#B2967D;
  --cocoa:#7D5A44;
  --espresso:#4A342A;

  --white:#FFFFFF;
  --success:#4C7A5E;
  --success-bg:#E7F0EA;
  --danger:#B5544A;
  --danger-bg:#F6E7E5;

  --font-title:'Playfair Display', serif;
  --font-body:'Inter', sans-serif;

  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --radius-pill:999px;

  --shadow-sm: 0 2px 8px rgba(74,52,42,0.08);
  --shadow-md: 0 6px 20px rgba(74,52,42,0.12);
  --shadow-lg: 0 10px 34px rgba(74,52,42,0.20);
  --shadow-cart: 0 -8px 28px rgba(74,52,42,0.16);

  --cart-collapsed-h: 78px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{
  height:100%;
  background:var(--linen);
  font-family:var(--font-body);
  color:var(--espresso);
  overscroll-behavior-y:none;
}

body{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  padding-bottom: calc(var(--cart-collapsed-h) + var(--safe-bottom) + 10px);
}

button{ font-family:inherit; border:none; background:none; cursor:pointer; -webkit-appearance:none; }
input{ font-family:inherit; }
::selection{ background:var(--camel); color:var(--white); }

/* Scrollbars horizontales discretas */
.scroll-row::-webkit-scrollbar{ height:0; }
.scroll-row{ scrollbar-width:none; }

/* Ripple base */
.ripple-host{ position:relative; overflow:hidden; }
.ripple{
  position:absolute; border-radius:50%; pointer-events:none;
  background:rgba(255,255,255,0.55);
  transform:scale(0);
  animation:rippleAnim 550ms ease-out;
}
@keyframes rippleAnim{
  to{ transform:scale(2.6); opacity:0; }
}

/* ==========================================================================
   2. BARRA SUPERIOR
   ========================================================================== */
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--linen);
  padding:14px 16px 12px;
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid rgba(74,52,42,0.08);
}
.btn-back{
  width:40px; height:40px; border-radius:var(--radius-pill);
  background:var(--white); box-shadow:var(--shadow-sm);
  display:flex; align-items:center; justify-content:center;
  color:var(--espresso); flex-shrink:0;
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn-back:active{ transform:scale(0.90); box-shadow:none; }
.btn-back svg{ width:20px; height:20px; }

.topbar-title{ flex:1; min-width:0; }
.topbar-title h1{
  font-family:var(--font-title); font-weight:700;
  font-size:20px; letter-spacing:-0.2px; line-height:1.1;
  color:var(--espresso);
}
.topbar-title p{
  font-size:11.5px; color:var(--cocoa); font-weight:500;
  text-transform:capitalize; margin-top:2px;
}

.store-badge{
  width:36px; height:36px; border-radius:10px;
  background:var(--espresso); color:var(--linen);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; box-shadow:var(--shadow-sm);
}
.store-badge svg{ width:18px; height:18px; }

/* ==========================================================================
   3. CONTENEDOR PRINCIPAL
   ========================================================================== */
main{ flex:1; display:flex; flex-direction:column; }

.section{ padding:16px 16px 0; }
.section-label{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:10px;
}
.section-label h2{
  font-size:13px; font-weight:700; text-transform:uppercase;
  letter-spacing:0.6px; color:var(--cocoa);
  display:flex; align-items:center; gap:6px;
}

/* ==========================================================================
   4. SELECTOR TIPO DE VENTA
   ========================================================================== */
.sale-type-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
}
.sale-type-card{
  position:relative; overflow:hidden;
  background:var(--white);
  border-radius:var(--radius-lg);
  padding:18px 14px;
  display:flex; flex-direction:column; align-items:flex-start; gap:10px;
  border:2px solid transparent;
  box-shadow:var(--shadow-sm);
  transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease, border-color .18s ease;
  text-align:left;
}
.sale-type-card:active{ transform:scale(0.96); }
.sale-type-card.selected{
  border-color:var(--camel);
  box-shadow:var(--shadow-md);
  background:linear-gradient(160deg, var(--white) 0%, #FBF8F4 100%);
}
.sale-type-icon{
  width:42px; height:42px; border-radius:12px;
  background:var(--khaki);
  display:flex; align-items:center; justify-content:center;
  color:var(--espresso);
  transition:background .2s ease, color .2s ease, transform .2s ease;
}
.sale-type-card.selected .sale-type-icon{
  background:var(--camel); color:var(--white);
  transform:scale(1.06) rotate(-4deg);
}
.sale-type-icon svg{ width:22px; height:22px; }
.sale-type-card h3{
  font-family:var(--font-title); font-size:16.5px; font-weight:700;
}
.sale-type-card span{
  font-size:11.5px; color:var(--cocoa); font-weight:500; line-height:1.3;
}
.sale-type-check{
  position:absolute; top:10px; right:10px;
  width:20px; height:20px; border-radius:50%;
  background:var(--camel); color:var(--white);
  display:flex; align-items:center; justify-content:center;
  opacity:0; transform:scale(0.5);
  transition:opacity .18s ease, transform .18s ease;
}
.sale-type-card.selected .sale-type-check{ opacity:1; transform:scale(1); }
.sale-type-check svg{ width:12px; height:12px; }

/* ==========================================================================
   5. SELECTOR DE MESAS
   ========================================================================== */
.tables-wrap{
  max-height:0; opacity:0; overflow:hidden;
  transition:max-height .38s cubic-bezier(.4,0,.2,1), opacity .28s ease, margin .38s ease;
}
.tables-wrap.open{
  max-height:600px; opacity:1;
}
.tables-grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:10px;
  padding-top:2px; padding-bottom:6px;
}
.table-card{
  position:relative; overflow:hidden;
  border-radius:var(--radius-md);
  padding:14px 8px 12px;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  background:var(--success-bg);
  border:2px solid transparent;
  transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.table-card:active{ transform:scale(0.94); }
.table-card.selected{
  border-color:var(--success);
  box-shadow:var(--shadow-sm);
}
.table-card.occupied{
  background:var(--danger-bg);
}
.table-card.occupied.selected{ border-color:var(--danger); }

.table-num{
  font-family:var(--font-title); font-weight:700; font-size:15px;
  color:var(--espresso);
}
.table-status{
  font-size:10.5px; font-weight:700; letter-spacing:0.3px;
}
.table-card:not(.occupied) .table-status{ color:var(--success); }
.table-card.occupied .table-status{ color:var(--danger); }
.table-dot{
  width:7px; height:7px; border-radius:50%;
}
.table-card:not(.occupied) .table-dot{ background:var(--success); }
.table-card.occupied .table-dot{ background:var(--danger); }

/* ==========================================================================
   6. FAVORITOS
   ========================================================================== */
.scroll-row{
  display:flex; gap:10px; overflow-x:auto;
  padding:2px 16px 6px; margin:0 -16px;
  scroll-snap-type:x proximity;
}
.fav-chip{
  scroll-snap-align:start;
  flex-shrink:0;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  width:74px;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
.fav-chip:active{ transform:scale(0.90); }
.fav-circle{
  width:58px; height:58px; border-radius:50%;
  background:var(--white);
  display:flex; align-items:center; justify-content:center;
  font-size:24px;
  box-shadow:var(--shadow-sm);
  border:2px solid var(--khaki);
  position:relative;
}
.fav-star{
  position:absolute; top:-4px; right:-2px;
  font-size:13px;
}
.fav-chip span{
  font-size:10.5px; font-weight:600; text-align:center;
  line-height:1.2; color:var(--espresso);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:100%;
}

/* ==========================================================================
   7. CATEGORIAS (CHIPS)
   ========================================================================== */
.cat-row{ padding-bottom:4px; }
.cat-chip{
  scroll-snap-align:start;
  flex-shrink:0;
  padding:9px 18px;
  border-radius:var(--radius-pill);
  background:var(--white);
  font-size:13px; font-weight:600; color:var(--cocoa);
  box-shadow:var(--shadow-sm);
  transition:background .2s ease, color .2s ease, transform .15s ease;
  white-space:nowrap;
}
.cat-chip:active{ transform:scale(0.92); }
.cat-chip.active{
  background:var(--espresso); color:var(--linen);
  box-shadow:var(--shadow-md);
}

/* ==========================================================================
   8. BUSCADOR
   ========================================================================== */
.search-wrap{
  padding:14px 16px 8px;
}
.search-box{
  position:relative;
  display:flex; align-items:center;
  background:var(--white);
  border-radius:var(--radius-md);
  box-shadow:var(--shadow-sm);
  padding:0 14px;
  border:2px solid transparent;
  transition:border-color .2s ease, box-shadow .2s ease;
}
.search-box:focus-within{
  border-color:var(--camel);
  box-shadow:var(--shadow-md);
}
.search-box svg{ width:19px; height:19px; color:var(--cocoa); flex-shrink:0; }
.search-box input{
  flex:1; border:none; outline:none; background:transparent;
  padding:13px 10px; font-size:15px; color:var(--espresso);
}
.search-box input::placeholder{ color:#A99A8C; }
.search-clear{
  width:22px; height:22px; border-radius:50%;
  background:var(--khaki); color:var(--espresso);
  display:none; align-items:center; justify-content:center;
  flex-shrink:0;
}
.search-clear.show{ display:flex; }
.search-clear svg{ width:12px; height:12px; }

/* ==========================================================================
   9. GRID DE PRODUCTOS
   ========================================================================== */
.products-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  padding:6px 16px 20px;
}
.product-card{
  background:var(--white);
  border-radius:var(--radius-lg);
  overflow:hidden;
  box-shadow:var(--shadow-sm);
  display:flex; flex-direction:column;
  transition:transform .18s ease, box-shadow .18s ease;
  animation:cardIn .3s ease backwards;
}
.product-card:active{ transform:scale(0.97); }
@keyframes cardIn{
  from{ opacity:0; transform:translateY(10px); }
  to{ opacity:1; transform:translateY(0); }
}
.product-img{
  height:96px; width:100%;
  display:flex; align-items:center; justify-content:center;
  font-size:38px;
  background:linear-gradient(150deg, var(--khaki) 0%, #E4D9CB 100%);
  position:relative;
}
.stock-tag{
  position:absolute; top:8px; left:8px;
  font-size:9.5px; font-weight:700; letter-spacing:0.3px;
  padding:3px 8px; border-radius:var(--radius-pill);
  background:rgba(255,255,255,0.88); color:var(--cocoa);
}
.stock-tag.low{ background:rgba(181,84,74,0.9); color:var(--white); }

.product-info{
  padding:10px 10px 12px;
  display:flex; flex-direction:column; gap:2px;
  flex:1;
}
.product-name{
  font-size:12.8px; font-weight:700; color:var(--espresso);
  line-height:1.25;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  min-height:32px;
}
.product-bottom{
  display:flex; align-items:flex-end; justify-content:space-between;
  margin-top:6px;
}
.product-price{
  font-family:var(--font-title); font-weight:700; font-size:15.5px;
  color:var(--espresso);
}
.btn-add{
  width:32px; height:32px; border-radius:var(--radius-pill);
  background:var(--espresso); color:var(--linen);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; box-shadow:var(--shadow-sm);
  transition:transform .15s cubic-bezier(.34,1.56,.64,1), background .2s ease;
  position:relative; overflow:hidden;
}
.btn-add svg{ width:16px; height:16px; }
.btn-add:active{ transform:scale(0.82); }
.btn-add.pulse{ animation:addPulse .38s ease; }
@keyframes addPulse{
  0%{ transform:scale(1); background:var(--espresso); }
  40%{ transform:scale(1.25); background:var(--success); }
  100%{ transform:scale(1); background:var(--espresso); }
}

.empty-state{
  grid-column:1/-1;
  text-align:center; padding:40px 20px;
  color:var(--cocoa);
}
.empty-state .emoji{ font-size:36px; margin-bottom:8px; }
.empty-state p{ font-size:13.5px; font-weight:500; }

/* ==========================================================================
   10. TOAST
   ========================================================================== */
.toast-container{
  position:fixed; left:0; right:0;
  bottom: calc(var(--cart-collapsed-h) + var(--safe-bottom) + 14px);
  display:flex; justify-content:center;
  z-index:80; pointer-events:none;
}
.toast{
  display:flex; align-items:center; gap:8px;
  background:var(--espresso); color:var(--linen);
  padding:12px 18px; border-radius:var(--radius-pill);
  font-size:13.5px; font-weight:600;
  box-shadow:var(--shadow-lg);
  transform:translateY(20px); opacity:0;
  transition:transform .32s cubic-bezier(.34,1.56,.64,1), opacity .32s ease;
  max-width:88vw;
}
.toast.show{ transform:translateY(0); opacity:1; }
.toast .check-circle{
  width:18px; height:18px; border-radius:50%;
  background:var(--success); flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.toast .check-circle svg{ width:11px; height:11px; color:var(--white); }
.toast span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* ==========================================================================
   11. CARRITO FIJO
   ========================================================================== */
.cart-panel{
  position:fixed; left:0; right:0; bottom:0; z-index:60;
  background:var(--white);
  border-radius:24px 24px 0 0;
  box-shadow:var(--shadow-cart);
  transition:transform .1s linear;
  display:flex; flex-direction:column;
  max-height:88vh;
}

/* Barra colapsada (siempre visible, clic para expandir) */
.cart-summary{
  height:var(--cart-collapsed-h);
  display:flex; align-items:center; gap:12px;
  padding:0 16px;
  padding-bottom:var(--safe-bottom);
  cursor:pointer;
}
.cart-handle{
  position:absolute; top:8px; left:50%; transform:translateX(-50%);
  width:38px; height:4px; border-radius:var(--radius-pill);
  background:var(--khaki);
}
.cart-icon-wrap{
  width:46px; height:46px; border-radius:14px;
  background:var(--espresso); color:var(--linen);
  display:flex; align-items:center; justify-content:center;
  position:relative; flex-shrink:0;
}
.cart-icon-wrap svg{ width:22px; height:22px; }
.cart-badge{
  position:absolute; top:-6px; right:-6px;
  min-width:19px; height:19px; padding:0 4px; border-radius:var(--radius-pill);
  background:var(--camel); color:var(--white);
  font-size:10.5px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  border:2px solid var(--white);
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.cart-badge.bump{ animation:badgeBump .35s ease; }
@keyframes badgeBump{
  0%{ transform:scale(1); } 45%{ transform:scale(1.45); } 100%{ transform:scale(1); }
}

.cart-summary-text{ flex:1; min-width:0; }
.cart-summary-text .label{
  font-size:11px; color:var(--cocoa); font-weight:600;
}
.cart-summary-text .amount{
  font-family:var(--font-title); font-weight:700; font-size:19px;
  color:var(--espresso);
}
.cart-chevron{
  color:var(--cocoa); flex-shrink:0; margin-right:2px;
  transition:transform .3s ease;
}
.cart-chevron svg{ width:18px; height:18px; }
.cart-panel.expanded .cart-chevron{ transform:rotate(180deg); }

.btn-checkout{
  position:relative; overflow:hidden;
  flex-shrink:0;
  background:var(--camel); color:var(--white);
  font-weight:800; font-size:14.5px;
  padding:13px 20px; border-radius:var(--radius-pill);
  box-shadow:0 6px 16px rgba(178,150,125,0.55);
  display:flex; align-items:center; gap:6px;
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn-checkout:active{ transform:scale(0.94); }
.btn-checkout svg{ width:16px; height:16px; }

/* Contenido expandido */
.cart-expanded{
  max-height:0; overflow:hidden;
  transition:max-height .38s cubic-bezier(.4,0,.2,1);
  display:flex; flex-direction:column;
}
.cart-panel.expanded .cart-expanded{
  max-height:70vh;
}
.cart-scroll{
  overflow-y:auto;
  padding:4px 16px 6px;
  border-top:1px solid rgba(74,52,42,0.08);
  max-height:calc(70vh - 170px);
}

.cart-item{
  display:flex; align-items:center; gap:10px;
  padding:12px 0;
  border-bottom:1px solid rgba(74,52,42,0.07);
  transition:opacity .25s ease, transform .25s ease, max-height .3s ease, padding .3s ease, margin .3s ease;
}
.cart-item.removing{
  opacity:0; transform:translateX(60px); max-height:0; padding:0; margin:0; border:none; overflow:hidden;
}
.cart-item-emoji{
  width:42px; height:42px; border-radius:12px; flex-shrink:0;
  background:var(--linen); display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
.cart-item-info{ flex:1; min-width:0; }
.cart-item-name{ font-size:13px; font-weight:700; color:var(--espresso); }
.cart-item-price{ font-size:11.5px; color:var(--cocoa); font-weight:500; margin-top:1px; }

.qty-control{
  display:flex; align-items:center; gap:8px;
  background:var(--linen); border-radius:var(--radius-pill);
  padding:4px;
}
.qty-btn{
  width:26px; height:26px; border-radius:50%;
  background:var(--white); color:var(--espresso);
  display:flex; align-items:center; justify-content:center;
  box-shadow:var(--shadow-sm);
  transition:transform .12s ease;
}
.qty-btn:active{ transform:scale(0.85); }
.qty-btn svg{ width:12px; height:12px; }
.qty-value{
  min-width:16px; text-align:center; font-weight:700; font-size:13px;
  transition:transform .18s ease;
}
.qty-value.bump{ animation:qtyBump .3s ease; }
@keyframes qtyBump{ 0%{transform:scale(1);} 50%{transform:scale(1.35);} 100%{transform:scale(1);} }

.cart-item-subtotal{ font-size:13px; font-weight:800; color:var(--espresso); width:62px; text-align:right; }

.btn-remove{
  width:28px; height:28px; border-radius:50%; flex-shrink:0;
  color:var(--danger); display:flex; align-items:center; justify-content:center;
  transition:background .15s ease, transform .15s ease;
}
.btn-remove:active{ background:var(--danger-bg); transform:scale(0.85); }
.btn-remove svg{ width:15px; height:15px; }

/* Métodos de pago */
.pay-section{ padding:12px 16px 4px; }
.pay-title{
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
  color:var(--cocoa); margin-bottom:9px;
}
.pay-grid{
  display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;
}
.pay-btn{
  display:flex; flex-direction:column; align-items:center; gap:5px;
  padding:11px 4px;
  border-radius:var(--radius-md);
  background:var(--linen);
  border:2px solid transparent;
  transition:all .18s ease;
}
.pay-btn span{ font-size:10.5px; font-weight:700; color:var(--cocoa); }
.pay-btn svg{ width:19px; height:19px; color:var(--cocoa); }
.pay-btn.selected{
  background:var(--espresso); border-color:var(--espresso);
  transform:translateY(-2px);
  box-shadow:var(--shadow-md);
}
.pay-btn.selected svg, .pay-btn.selected span{ color:var(--linen); }
.pay-btn:active{ transform:scale(0.94); }

/* Totales */
.totals-box{ padding:14px 16px 4px; }
.totals-row{
  display:flex; justify-content:space-between; align-items:center;
  font-size:13px; color:var(--cocoa); font-weight:500;
  padding:3px 0;
}
.totals-row.grand{
  padding-top:9px; margin-top:6px; border-top:1.5px dashed var(--khaki);
}
.totals-row.grand .label{
  font-family:var(--font-title); font-size:16px; font-weight:700; color:var(--espresso);
}
.totals-row.grand .value{
  font-family:var(--font-title); font-size:21px; font-weight:800; color:var(--espresso);
}

/* Overlay al expandir carrito */
.cart-overlay{
  position:fixed; inset:0; background:rgba(74,52,42,0.32);
  z-index:55; opacity:0; pointer-events:none;
  transition:opacity .3s ease;
}
.cart-overlay.show{ opacity:1; pointer-events:auto; }

/* ==========================================================================

@media (prefers-reduced-motion: reduce){

}
</style>
</head>
<body>

<main>

  <!-- ==========================================================================

        <div class="sale-type-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2l1.5 3M18 2l-1.5 3M4 9h16l-1.5 10a2 2 0 01-2 1.8H7.5a2 2 0 01-2-1.8L4 9z"/></svg></div>

        <div class="sale-type-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M5 10v9m14-9v9M3 6h18l-1 4H4l-1-4z"/></svg></div>

      <div class="totals-row"><span>Subtotal</span><span id="subtotalValue">$ 0</span></div>

<script src="../services/auth.service.js"></script>
<script>
/* ==========================================================================
   1. CONFIG API
   ========================================================================== */
const API_BASE = "http://127.0.0.1:8000/api";

/* Categorías: siguen fijas en el código hasta que la BD tenga categoria_id.
   Todos los productos reales caen en 'todos' por ahora. */
const CATEGORIES = [
  { id:'todos', name:'Todos' },
  { id:'bebidas', name:'Bebidas' },
  { id:'snacks', name:'Snacks' },
  { id:'cigarrillos', name:'Cigarrillos' },
  { id:'licores', name:'Licores' },
  { id:'helados', name:'Helados' },
  { id:'aseo', name:'Aseo' },
  { id:'pan', name:'Pan' },
];

/* PRODUCTS se llena desde la API en loadProductos(). Empieza vacío. */
let PRODUCTS = [];

const DEFAULT_EMOJI = '🛒';

/* Convierte un producto de la API (id, nombre, precio, activo)
   al formato que usa la interfaz. Sin categoria/stock/favorito reales
   todavía: se dejan valores neutros hasta que existan esas columnas. */
function mapProductoApi(p, index){
  return {
    id: p.id,
    name: p.nombre,
    price: parseFloat(p.precio),
    stock: null,               // no existe columna todavía
    cat: 'todos',               // no existe categoria_id todavía
    emoji: DEFAULT_EMOJI,
    fav: index < 8,             // temporal: primeros 8 como favoritos
  };
}

async function loadProductos(){
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = `<div class="empty-state"><div class="emoji">⏳</div><p>Cargando productos...</p></div>`;
  try{
    const token = AuthService.getToken();
    const headers = {
      'Accept': 'application/json',
      'Authorization': `Bearer ${token}`
    };

    // ?all=1 → el backend devuelve el catálogo completo en una sola respuesta,
    // sin paginar. Necesario para que el buscador/filtros sean instantáneos.
    const res = await fetch(`${API_BASE}/productos?all=1`, { headers });
    if(!res.ok) throw new Error('Respuesta no OK: ' + res.status);
    const json = await res.json();
    const lista = json.data || (Array.isArray(json) ? json : []);

    PRODUCTS = lista.map(mapProductoApi);
    renderFavorites();
    renderProducts();
  }catch(err){
    console.error('Error cargando productos:', err);
    grid.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><p>No se pudieron cargar los productos. Verifica tu conexión con la API.</p></div>`;
  }
}
const TABLES = [
  { id:1, occupied:false, total:0 },
  { id:2, occupied:true,  total:28000 },
  { id:3, occupied:false, total:0 },
  { id:4, occupied:true,  total:18500 },
  { id:5, occupied:false, total:0 },
  { id:6, occupied:true,  total:42300 },
];

const PAY_METHODS = [
  { id:'efectivo',  name:'Efectivo',  icon:'<path d="M3 8h18v10a1 1 0 01-1 1H4a1 1 0 01-1-1V8z"/><circle cx="12" cy="13" r="2.5"/><path d="M3 8l2-4h14l2 4"/>' },
  { id:'nequi',     name:'Nequi',     icon:'<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 18h6"/>' },
  { id:'daviplata', name:'Daviplata', icon:'<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 18h6"/>' },
  { id:'tarjeta',   name:'Tarjeta',   icon:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>' },
  { id:'fiado',     name:'Fiado',     icon:'<path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/>' },
];

/* ==========================================================================
   2. ESTADO
   ========================================================================== */
let state = {
  saleType: 'llevar',
  selectedTable: null,
  activeCategory: 'todos',
  searchQuery: '',
  cart: {},          // { productId: qty }
  paymentMethod: 'efectivo',
  cartExpanded: false,
};

const fmt = (n) => '$ ' + n.toLocaleString('es-CO');

/* ==========================================================================
   3. FECHA ACTUAL
   ========================================================================== */
function renderFecha(){
  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const d = new Date();
  document.getElementById('fechaActual').textContent =
    `${dias[d.getDay()]}, ${d.getDate()} de ${meses[d.getMonth()]}`;
}

/* ==========================================================================
   4. RENDER: TIPO DE VENTA
   ========================================================================== */
const cardLlevar = document.getElementById('cardParaLlevar');
const cardMesa = document.getElementById('cardMesa');
const tablesWrap = document.getElementById('tablesWrap');

function setSaleType(type){
  state.saleType = type;
  cardLlevar.classList.toggle('selected', type === 'llevar');
  cardMesa.classList.toggle('selected', type === 'mesa');
  tablesWrap.classList.toggle('open', type === 'mesa');
  if(type !== 'mesa'){ state.selectedTable = null; renderTables(); }
}
cardLlevar.addEventListener('click', () => setSaleType('llevar'));
cardMesa.addEventListener('click', () => setSaleType('mesa'));

/* ==========================================================================
   5. RENDER: MESAS
   ========================================================================== */
function renderTables(){
  const grid = document.getElementById('tablesGrid');
  grid.innerHTML = TABLES.map(t => `
    <button class="table-card ripple-host ${t.occupied ? 'occupied' : ''} ${state.selectedTable === t.id ? 'selected' : ''}" data-table="${t.id}">
      <span class="table-num">Mesa ${t.id}</span>
      <span class="table-status">
        <span class="table-dot" style="display:inline-block;margin-right:4px;"></span>${t.occupied ? fmt(t.total) : 'Libre'}
      </span>
    </button>
  `).join('');
  grid.querySelectorAll('.table-card').forEach(el => {
    el.addEventListener('click', () => {
      const id = parseInt(el.dataset.table);
      state.selectedTable = state.selectedTable === id ? null : id;
      renderTables();
      attachRipples();
    });
  });
}

/* ==========================================================================
   6. RENDER: FAVORITOS
   ========================================================================== */
function renderFavorites(){
  const favs = PRODUCTS.filter(p => p.fav);
  const row = document.getElementById('favRow');
  row.innerHTML = favs.map(p => `
    <button class="fav-chip ripple-host" data-id="${p.id}">
      <div class="fav-circle">
        ${p.emoji}
        <span class="fav-star">⭐</span>
      </div>
      <span>${p.name.split(' ')[0]}</span>
    </button>
  `).join('');
  row.querySelectorAll('.fav-chip').forEach(el => {
    el.addEventListener('click', () => addToCart(parseInt(el.dataset.id)));
  });
}

/* ==========================================================================
   7. RENDER: CATEGORIAS
   ========================================================================== */
function renderCategories(){
  const row = document.getElementById('catRow');
  row.innerHTML = CATEGORIES.map(c => `
    <button class="cat-chip ripple-host ${state.activeCategory === c.id ? 'active' : ''}" data-cat="${c.id}">${c.name}</button>
  `).join('');
  row.querySelectorAll('.cat-chip').forEach(el => {
    el.addEventListener('click', () => {
      state.activeCategory = el.dataset.cat;
      renderCategories();
      renderProducts();
      attachRipples();
    });
  });
}

/* ==========================================================================
   8. RENDER: PRODUCTOS
   ========================================================================== */
function renderProducts(){
  const grid = document.getElementById('productsGrid');
  let list = PRODUCTS.filter(p => {
    const matchCat = state.activeCategory === 'todos' || p.cat === state.activeCategory;
    const matchSearch = p.name.toLowerCase().includes(state.searchQuery.toLowerCase());
    return matchCat && matchSearch;
  });

  if(list.length === 0){
    grid.innerHTML = `<div class="empty-state"><div class="emoji">🔍</div><p>No se encontraron productos</p></div>`;
    return;
  }

  grid.innerHTML = list.map((p, i) => `
    <div class="product-card" style="animation-delay:${Math.min(i*25,200)}ms">
      <div class="product-img">
        ${p.emoji}
        ${p.stock !== null ? `<span class="stock-tag ${p.stock <= 3 ? 'low' : ''}">${p.stock <= 3 ? 'Últimas ' + p.stock : p.stock + ' und'}</span>` : ''}
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-bottom">
          <span class="product-price">${fmt(p.price)}</span>
          <button class="btn-add ripple-host" data-id="${p.id}" aria-label="Agregar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
      </div>
    </div>
  `).join('');

  grid.querySelectorAll('.btn-add').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      addToCart(parseInt(btn.dataset.id), btn);
    });
  });
  attachRipples();
}

/* ==========================================================================
   9. CARRITO: LOGICA
   ========================================================================== */
function addToCart(productId, btnEl){
  state.cart[productId] = (state.cart[productId] || 0) + 1;
  const product = PRODUCTS.find(p => p.id === productId);
  showToast(`${product.name} agregada`);
  if(btnEl){
    btnEl.classList.remove('pulse');
    void btnEl.offsetWidth;
    btnEl.classList.add('pulse');
  }
  renderCart();
  bumpBadge();
}

function changeQty(productId, delta){
  if(!state.cart[productId]) return;
  state.cart[productId] += delta;
  if(state.cart[productId] <= 0){
    removeFromCart(productId);
    return;
  }
  renderCart(productId);
}

function removeFromCart(productId){
  const itemEl = document.querySelector(`.cart-item[data-id="${productId}"]`);
  if(itemEl){
    itemEl.classList.add('removing');
    setTimeout(() => {
      delete state.cart[productId];
      renderCart();
    }, 260);
  } else {
    delete state.cart[productId];
    renderCart();
  }
}

function getCartItems(){
  return Object.entries(state.cart).map(([id, qty]) => {
    const product = PRODUCTS.find(p => p.id === parseInt(id));
    return { ...product, qty, subtotal: product.price * qty };
  });
}

function getCartTotal(){
  return getCartItems().reduce((sum, item) => sum + item.subtotal, 0);
}
function getCartCount(){
  return Object.values(state.cart).reduce((sum, q) => sum + q, 0);
}

function renderCart(bumpQtyId){
  const items = getCartItems();
  const total = getCartTotal();
  const count = getCartCount();

  document.getElementById('cartBadge').textContent = count;
  document.getElementById('cartLabel').textContent = count === 0 ? 'Carrito vacío' : `${count} producto${count !== 1 ? 's' : ''}`;
  document.getElementById('cartTotal').textContent = fmt(total);
  document.getElementById('subtotalValue').textContent = fmt(total);
  document.getElementById('grandTotalValue').textContent = fmt(total);

  const scroll = document.getElementById('cartScroll');
  if(items.length === 0){
    scroll.innerHTML = `<div class="empty-state" style="padding:26px 10px;"><div class="emoji">🛒</div><p>Aún no has agregado productos</p></div>`;
  } else {
    scroll.innerHTML = items.map(item => `
      <div class="cart-item" data-id="${item.id}">
        <div class="cart-item-emoji">${item.emoji}</div>
        <div class="cart-item-info">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-price">${fmt(item.price)} c/u</div>
        </div>
        <div class="qty-control">
          <button class="qty-btn" data-action="dec" data-id="${item.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h14"/></svg>
          </button>
          <span class="qty-value ${bumpQtyId == item.id ? 'bump' : ''}">${item.qty}</span>
          <button class="qty-btn" data-action="inc" data-id="${item.id}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
        </div>
        <div class="cart-item-subtotal">${fmt(item.subtotal)}</div>
        <button class="btn-remove" data-action="remove" data-id="${item.id}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0l-1 14a1 1 0 01-1 1H7a1 1 0 01-1-1L5 6"/></svg>
        </button>
      </div>
    `).join('');

    scroll.querySelectorAll('[data-action]').forEach(btn => {
      const id = parseInt(btn.dataset.id);
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        if(action === 'inc') changeQty(id, 1);
        if(action === 'dec') changeQty(id, -1);
        if(action === 'remove') removeFromCart(id);
      });
    });
  }
}

function bumpBadge(){
  const badge = document.getElementById('cartBadge');
  badge.classList.remove('bump');
  void badge.offsetWidth;
  badge.classList.add('bump');
}

/* ==========================================================================
   10. METODOS DE PAGO
   ========================================================================== */
function renderPayMethods(){
  const grid = document.getElementById('payGrid');
  grid.innerHTML = PAY_METHODS.map(m => `
    <button class="pay-btn ripple-host ${state.paymentMethod === m.id ? 'selected' : ''}" data-method="${m.id}">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${m.icon}</svg>
      <span>${m.name}</span>
    </button>
  `).join('');
  grid.querySelectorAll('.pay-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.paymentMethod = btn.dataset.method;
      renderPayMethods();
      attachRipples();
    });
  });
}

/* ==========================================================================
   11. TOAST
   ========================================================================== */
let toastTimeout;
function showToast(text){
  const toast = document.getElementById('toast');
  document.getElementById('toastText').textContent = '✔ ' + text;
  clearTimeout(toastTimeout);
  toast.classList.add('show');
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 1800);
}

/* ==========================================================================
   12. EXPANDIR / COLAPSAR CARRITO
   ========================================================================== */
const cartPanel = document.getElementById('cartPanel');
const cartSummary = document.getElementById('cartSummary');
const cartOverlay = document.getElementById('cartOverlay');

function toggleCart(force){
  state.cartExpanded = force !== undefined ? force : !state.cartExpanded;
  cartPanel.classList.toggle('expanded', state.cartExpanded);
  cartOverlay.classList.toggle('show', state.cartExpanded);
}
cartSummary.addEventListener('click', (e) => {
  if(e.target.closest('#btnCheckout')) return;
  toggleCart();
});
cartOverlay.addEventListener('click', () => toggleCart(false));

document.getElementById('btnCheckout').addEventListener('click', (e) => {
  e.stopPropagation();
  if(getCartCount() === 0){
    showToast('Agrega productos para cobrar');
    return;
  }
  toggleCart(true);
  showToast('Listo para cobrar → conectar con API');
});

/* ==========================================================================
   13. BUSCADOR
   ========================================================================== */
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
searchInput.addEventListener('input', () => {
  state.searchQuery = searchInput.value;
  searchClear.classList.toggle('show', state.searchQuery.length > 0);
  renderProducts();
});
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  state.searchQuery = '';
  searchClear.classList.remove('show');
  renderProducts();
  searchInput.focus();
});

/* ==========================================================================
   14. BOTON REGRESAR (demo)
   ========================================================================== */
document.getElementById('btnBack').addEventListener('click', () => {
  showToast('Regresar al Dashboard');
});

/* ==========================================================================
   15. RIPPLE EFFECT
   ========================================================================== */
function attachRipples(){
  document.querySelectorAll('.ripple-host').forEach(el => {
    if(el.dataset.rippleBound) return;
    el.dataset.rippleBound = 'true';
    el.addEventListener('click', function(e){
      const rect = this.getBoundingClientRect();
      const ripple = document.createElement('span');
      const size = Math.max(rect.width, rect.height);
      ripple.className = 'ripple';
      ripple.style.width = ripple.style.height = size + 'px';
      ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
      ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
      this.appendChild(ripple);
      setTimeout(() => ripple.remove(), 550);
    });
  });
}

/* ==========================================================================
   16. INIT
   ========================================================================== */
