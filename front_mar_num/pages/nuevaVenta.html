<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Nueva Venta | Tienda Mar &amp; Num</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    
    <style>
      /* ==========================================================================
   1. VARIABLES Y RESET
   ========================================================================== */
      :root {
        --linen: #f5f1ea;
        --khaki: #d7c9b8;
        --camel: #b2967d;
        --cocoa: #7d5a44;
        --espresso: #4a342a;

        --white: #ffffff;
        --success: #4c7a5e;
        --success-bg: #e7f0ea;
        --danger: #b5544a;
        --danger-bg: #f6e7e5;

        --font-title: "Playfair Display", serif;
        --font-body: "Inter", sans-serif;

        --radius-sm: 10px;
        --radius-md: 16px;
        --radius-lg: 22px;
        --radius-pill: 999px;

        --shadow-sm: 0 2px 8px rgba(74, 52, 42, 0.08);
        --shadow-md: 0 6px 20px rgba(74, 52, 42, 0.12);
        --shadow-lg: 0 10px 34px rgba(74, 52, 42, 0.2);
        --shadow-cart: 0 -8px 28px rgba(74, 52, 42, 0.16);

        --cart-collapsed-h: 78px;
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        height: 100%;
        background: var(--linen);
        font-family: var(--font-body);
        color: var(--espresso);
        overscroll-behavior-y: none;
      }

      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding-bottom: calc(
          var(--cart-collapsed-h) + var(--safe-bottom) + 10px
        );
      }

      button {
        font-family: inherit;
        border: none;
        background: none;
        cursor: pointer;
        -webkit-appearance: none;
      }
      input {
        font-family: inherit;
      }
      ::selection {
        background: var(--camel);
        color: var(--white);
      }

      /* Scrollbars horizontales discretas */
      .scroll-row::-webkit-scrollbar {
        height: 0;
      }
      .scroll-row {
        scrollbar-width: none;
      }

      /* Ripple base */
      .ripple-host {
        position: relative;
        overflow: hidden;
      }
      .ripple {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        background: rgba(255, 255, 255, 0.55);
        transform: scale(0);
        animation: rippleAnim 550ms ease-out;
      }
      @keyframes rippleAnim {
        to {
          transform: scale(2.6);
          opacity: 0;
        }
      }

      /* ==========================================================================
   2. BARRA SUPERIOR
   ========================================================================== */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: var(--linen);
        padding: 14px 16px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(74, 52, 42, 0.08);
      }
      .btn-back {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-pill);
        background: var(--white);
        box-shadow: var(--shadow-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--espresso);
        flex-shrink: 0;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .btn-back:active {
        transform: scale(0.9);
        box-shadow: none;
      }
      .btn-back svg {
        width: 20px;
        height: 20px;
      }

      .topbar-title {
        flex: 1;
        min-width: 0;
      }
      .topbar-title h1 {
        font-family: var(--font-title);
        font-weight: 700;
        font-size: 20px;
        letter-spacing: -0.2px;
        line-height: 1.1;
        color: var(--espresso);
      }
      .topbar-title p {
        font-size: 11.5px;
        color: var(--cocoa);
        font-weight: 500;
        text-transform: capitalize;
        margin-top: 2px;
      }

      .store-badge {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: var(--espresso);
        color: var(--linen);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: var(--shadow-sm);
      }
      .store-badge svg {
        width: 18px;
        height: 18px;
      }

      /* ==========================================================================
   3. CONTENEDOR PRINCIPAL
   ========================================================================== */
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .section {
        padding: 16px 16px 0;
      }
      .section-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .section-label h2 {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--cocoa);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* ==========================================================================
   4. SELECTOR TIPO DE VENTA
   ========================================================================== */
      .sale-type-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .sale-type-card {
        position: relative;
        overflow: hidden;
        background: var(--white);
        border-radius: var(--radius-lg);
        padding: 18px 14px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        border: 2px solid transparent;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 0.18s ease,
          border-color 0.18s ease;
        text-align: left;
      }
      .sale-type-card:active {
        transform: scale(0.96);
      }
      .sale-type-card.selected {
        border-color: var(--camel);
        box-shadow: var(--shadow-md);
        background: linear-gradient(160deg, var(--white) 0%, #fbf8f4 100%);
      }
      .sale-type-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: var(--khaki);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--espresso);
        transition:
          background 0.2s ease,
          color 0.2s ease,
          transform 0.2s ease;
      }
      .sale-type-card.selected .sale-type-icon {
        background: var(--camel);
        color: var(--white);
        transform: scale(1.06) rotate(-4deg);
      }
      .sale-type-icon svg {
        width: 22px;
        height: 22px;
      }
      .sale-type-card h3 {
        font-family: var(--font-title);
        font-size: 16.5px;
        font-weight: 700;
      }
      .sale-type-card span {
        font-size: 11.5px;
        color: var(--cocoa);
        font-weight: 500;
        line-height: 1.3;
      }
      .sale-type-check {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--camel);
        color: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.5);
        transition:
          opacity 0.18s ease,
          transform 0.18s ease;
      }
      .sale-type-card.selected .sale-type-check {
        opacity: 1;
        transform: scale(1);
      }
      .sale-type-check svg {
        width: 12px;
        height: 12px;
      }

      /* ==========================================================================
   5. SELECTOR DE MESAS
   ========================================================================== */
      .tables-wrap {
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        transition:
          max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1),
          opacity 0.28s ease,
          margin 0.38s ease;
      }
      .tables-wrap.open {
        max-height: 600px;
        opacity: 1;
      }
      .tables-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        padding-top: 2px;
        padding-bottom: 6px;
      }
      .table-card {
        position: relative;
        overflow: hidden;
        border-radius: var(--radius-md);
        padding: 14px 8px 12px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        background: var(--success-bg);
        border: 2px solid transparent;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease,
          box-shadow 0.15s ease;
      }
      .table-card:active {
        transform: scale(0.94);
      }
      .table-card.selected {
        border-color: var(--success);
        box-shadow: var(--shadow-sm);
      }
      .table-card.occupied {
        background: var(--danger-bg);
      }
      .table-card.occupied.selected {
        border-color: var(--danger);
      }

      .table-num {
        font-family: var(--font-title);
        font-weight: 700;
        font-size: 15px;
        color: var(--espresso);
      }
      .table-status {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
      }
      .table-card:not(.occupied) .table-status {
        color: var(--success);
      }
      .table-card.occupied .table-status {
        color: var(--danger);
      }
      .table-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
      }
      .table-card:not(.occupied) .table-dot {
        background: var(--success);
      }
      .table-card.occupied .table-dot {
        background: var(--danger);
      }

      /* ==========================================================================
   5b. BARRA DE CONTEXTO ACTIVO (venta actual)
   ========================================================================== */
      .context-bar {
        margin: 14px 16px 0;
        padding: 12px 14px;
        border-radius: var(--radius-md);
        background: var(--espresso);
        color: var(--linen);
        display: none;
        align-items: center;
        gap: 10px;
        box-shadow: var(--shadow-sm);
        animation: contextIn 0.25s ease;
      }
      .context-bar.show {
        display: flex;
      }
      @keyframes contextIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .context-bar-icon {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .context-bar-icon svg {
        width: 17px;
        height: 17px;
      }
      .context-bar-text {
        flex: 1;
        min-width: 0;
      }
      .context-bar-title {
        font-size: 13px;
        font-weight: 700;
      }
      .context-bar-sub {
        font-size: 10.5px;
        color: var(--khaki);
        opacity: 0.85;
        margin-top: 1px;
      }
      .context-bar-close {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }
      .context-bar-close:active {
        background: rgba(255, 255, 255, 0.25);
        transform: scale(0.88);
      }
      .context-bar-close svg {
        width: 13px;
        height: 13px;
      }

      /* ==========================================================================
   6. FAVORITOS
   ========================================================================== */
      .scroll-row {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        padding: 2px 16px 6px;
        margin: 0 -16px;
        scroll-snap-type: x proximity;
      }
      .fav-chip {
        scroll-snap-align: start;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        width: 74px;
        transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .fav-chip:active {
        transform: scale(0.9);
      }
      .fav-circle {
        width: 58px;
        height: 58px;
        border-radius: 50%;
        background: var(--white);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        box-shadow: var(--shadow-sm);
        border: 2px solid var(--khaki);
        position: relative;
      }
      .fav-star {
        position: absolute;
        top: -4px;
        right: -2px;
        font-size: 13px;
      }
      .fav-chip span {
        font-size: 10.5px;
        font-weight: 600;
        text-align: center;
        line-height: 1.2;
        color: var(--espresso);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        width: 100%;
      }

      /* ==========================================================================
   7. CATEGORIAS (CHIPS)
   ========================================================================== */
      .cat-row {
        padding-bottom: 4px;
      }
      .cat-chip {
        scroll-snap-align: start;
        flex-shrink: 0;
        padding: 9px 18px;
        border-radius: var(--radius-pill);
        background: var(--white);
        font-size: 13px;
        font-weight: 600;
        color: var(--cocoa);
        box-shadow: var(--shadow-sm);
        transition:
          background 0.2s ease,
          color 0.2s ease,
          transform 0.15s ease;
        white-space: nowrap;
      }
      .cat-chip:active {
        transform: scale(0.92);
      }
      .cat-chip.active {
        background: var(--espresso);
        color: var(--linen);
        box-shadow: var(--shadow-md);
      }

      /* ==========================================================================
   8. BUSCADOR
   ========================================================================== */
      .search-wrap {
        padding: 14px 16px 8px;
      }
      .search-box {
        position: relative;
        display: flex;
        align-items: center;
        background: var(--white);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        padding: 0 14px;
        border: 2px solid transparent;
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }
      .search-box:focus-within {
        border-color: var(--camel);
        box-shadow: var(--shadow-md);
      }
      .search-box svg {
        width: 19px;
        height: 19px;
        color: var(--cocoa);
        flex-shrink: 0;
      }
      .search-box input {
        flex: 1;
        border: none;
        outline: none;
        background: transparent;
        padding: 13px 10px;
        font-size: 15px;
        color: var(--espresso);
      }
      .search-box input::placeholder {
        color: #a99a8c;
      }
      .search-clear {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--khaki);
        color: var(--espresso);
        display: none;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .search-clear.show {
        display: flex;
      }
      .search-clear svg {
        width: 12px;
        height: 12px;
      }

      /* ==========================================================================
   9. GRID DE PRODUCTOS
   ========================================================================== */
      .products-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 6px 16px 20px;
      }
      .product-card {
        background: var(--white);
        border-radius: var(--radius-lg);
        overflow: hidden;
        box-shadow: var(--shadow-sm);
        display: flex;
        flex-direction: column;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
        animation: cardIn 0.3s ease backwards;
      }
      .product-card:active {
        transform: scale(0.97);
      }
      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .product-img {
        height: 96px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 38px;
        background: linear-gradient(150deg, var(--khaki) 0%, #e4d9cb 100%);
        position: relative;
      }
      .stock-tag {
        position: absolute;
        top: 8px;
        left: 8px;
        font-size: 9.5px;
        font-weight: 700;
        letter-spacing: 0.3px;
        padding: 3px 8px;
        border-radius: var(--radius-pill);
        background: rgba(255, 255, 255, 0.88);
        color: var(--cocoa);
      }
      .stock-tag.low {
        background: rgba(181, 84, 74, 0.9);
        color: var(--white);
      }

      .product-info {
        padding: 10px 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        flex: 1;
      }
      .product-name {
        font-size: 12.8px;
        font-weight: 700;
        color: var(--espresso);
        line-height: 1.25;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        min-height: 32px;
      }
      .product-bottom {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        margin-top: 6px;
      }
      .product-price {
        font-family: var(--font-title);
        font-weight: 700;
        font-size: 15.5px;
        color: var(--espresso);
      }
      .btn-add {
        width: 32px;
        height: 32px;
        border-radius: var(--radius-pill);
        background: var(--espresso);
        color: var(--linen);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: var(--shadow-sm);
        transition:
          transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
          background 0.2s ease;
        position: relative;
        overflow: hidden;
      }
      .btn-add svg {
        width: 16px;
        height: 16px;
      }
      .btn-add:active {
        transform: scale(0.82);
      }
      .btn-add.pulse {
        animation: addPulse 0.38s ease;
      }
      @keyframes addPulse {
        0% {
          transform: scale(1);
          background: var(--espresso);
        }
        40% {
          transform: scale(1.25);
          background: var(--success);
        }
        100% {
          transform: scale(1);
          background: var(--espresso);
        }
      }

      .empty-state {
        grid-column: 1/-1;
        text-align: center;
        padding: 40px 20px;
        color: var(--cocoa);
      }
      .empty-state .emoji {
        font-size: 36px;
        margin-bottom: 8px;
      }
      .empty-state p {
        font-size: 13.5px;
        font-weight: 500;
      }

      /* ==========================================================================
   10. TOAST
   ========================================================================== */
      .toast-container {
        position: fixed;
        left: 0;
        right: 0;
        bottom: calc(var(--cart-collapsed-h) + var(--safe-bottom) + 14px);
        display: flex;
        justify-content: center;
        z-index: 80;
        pointer-events: none;
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--espresso);
        color: var(--linen);
        padding: 12px 18px;
        border-radius: var(--radius-pill);
        font-size: 13.5px;
        font-weight: 600;
        box-shadow: var(--shadow-lg);
        transform: translateY(20px);
        opacity: 0;
        transition:
          transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1),
          opacity 0.32s ease;
        max-width: 88vw;
      }
      .toast.show {
        transform: translateY(0);
        opacity: 1;
      }
      .toast .check-circle {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--success);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .toast .check-circle svg {
        width: 11px;
        height: 11px;
        color: var(--white);
      }
      .toast span {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* ==========================================================================
   11. CARRITO FIJO
   ========================================================================== */
      .cart-panel {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 60;
        background: var(--white);
        border-radius: 24px 24px 0 0;
        box-shadow: var(--shadow-cart);
        transition: transform 0.1s linear;
        display: flex;
        flex-direction: column;
        max-height: 88vh;
      }

      /* Barra colapsada (siempre visible, clic para expandir) */
      .cart-summary {
        height: var(--cart-collapsed-h);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 16px;
        padding-bottom: var(--safe-bottom);
        cursor: pointer;
      }
      .cart-handle {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 38px;
        height: 4px;
        border-radius: var(--radius-pill);
        background: var(--khaki);
      }
      .cart-icon-wrap {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: var(--espresso);
        color: var(--linen);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        flex-shrink: 0;
      }
      .cart-icon-wrap svg {
        width: 22px;
        height: 22px;
      }
      .cart-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        min-width: 19px;
        height: 19px;
        padding: 0 4px;
        border-radius: var(--radius-pill);
        background: var(--camel);
        color: var(--white);
        font-size: 10.5px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--white);
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      }
      .cart-badge.bump {
        animation: badgeBump 0.35s ease;
      }
      @keyframes badgeBump {
        0% {
          transform: scale(1);
        }
        45% {
          transform: scale(1.45);
        }
        100% {
          transform: scale(1);
        }
      }

      .cart-summary-text {
        flex: 1;
        min-width: 0;
      }
      .cart-summary-text .label {
        font-size: 11px;
        color: var(--cocoa);
        font-weight: 600;
      }
      .cart-summary-text .amount {
        font-family: var(--font-title);
        font-weight: 700;
        font-size: 19px;
        color: var(--espresso);
      }
      .cart-chevron {
        color: var(--cocoa);
        flex-shrink: 0;
        margin-right: 2px;
        transition: transform 0.3s ease;
      }
      .cart-chevron svg {
        width: 18px;
        height: 18px;
      }
      .cart-panel.expanded .cart-chevron {
        transform: rotate(180deg);
      }

      .btn-checkout {
        position: relative;
        overflow: hidden;
        flex-shrink: 0;
        background: var(--camel);
        color: var(--white);
        font-weight: 800;
        font-size: 14.5px;
        padding: 13px 20px;
        border-radius: var(--radius-pill);
        box-shadow: 0 6px 16px rgba(178, 150, 125, 0.55);
        display: flex;
        align-items: center;
        gap: 6px;
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }
      .btn-checkout:active {
        transform: scale(0.94);
      }
      .btn-checkout svg {
        width: 16px;
        height: 16px;
      }

      /* Contenido expandido */
      .cart-expanded {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.38s cubic-bezier(0.4, 0, 0.2, 1);
        display: flex;
        flex-direction: column;
      }
      .cart-panel.expanded .cart-expanded {
        max-height: 70vh;
      }
      .cart-scroll {
        overflow-y: auto;
        padding: 4px 16px 6px;
        border-top: 1px solid rgba(74, 52, 42, 0.08);
        max-height: calc(70vh - 170px);
      }

      .cart-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 0;
        border-bottom: 1px solid rgba(74, 52, 42, 0.07);
        transition:
          opacity 0.25s ease,
          transform 0.25s ease,
          max-height 0.3s ease,
          padding 0.3s ease,
          margin 0.3s ease;
      }
      .cart-item.removing {
        opacity: 0;
        transform: translateX(60px);
        max-height: 0;
        padding: 0;
        margin: 0;
        border: none;
        overflow: hidden;
      }
      .cart-item-emoji {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        flex-shrink: 0;
        background: var(--linen);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }
      .cart-item-info {
        flex: 1;
        min-width: 0;
      }
      .cart-item-name {
        font-size: 13px;
        font-weight: 700;
        color: var(--espresso);
      }
      .cart-item-price {
        font-size: 11.5px;
        color: var(--cocoa);
        font-weight: 500;
        margin-top: 1px;
      }

      .qty-control {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--linen);
        border-radius: var(--radius-pill);
        padding: 4px;
      }
      .qty-btn {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--white);
        color: var(--espresso);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: var(--shadow-sm);
        transition: transform 0.12s ease;
      }
      .qty-btn:active {
        transform: scale(0.85);
      }
      .qty-btn svg {
        width: 12px;
        height: 12px;
      }
      .qty-value {
        min-width: 16px;
        text-align: center;
        font-weight: 700;
        font-size: 13px;
        transition: transform 0.18s ease;
      }
      .qty-value.bump {
        animation: qtyBump 0.3s ease;
      }
      @keyframes qtyBump {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.35);
        }
        100% {
          transform: scale(1);
        }
      }

      .cart-item-subtotal {
        font-size: 13px;
        font-weight: 800;
        color: var(--espresso);
        width: 62px;
        text-align: right;
      }

      .btn-remove {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex-shrink: 0;
        color: var(--danger);
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s ease,
          transform 0.15s ease;
      }
      .btn-remove:active {
        background: var(--danger-bg);
        transform: scale(0.85);
      }
      .btn-remove svg {
        width: 15px;
        height: 15px;
      }

      /* Métodos de pago */
      .pay-section {
        padding: 12px 16px 4px;
      }
      .pay-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--cocoa);
        margin-bottom: 9px;
      }
      .pay-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .pay-btn {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        padding: 11px 4px;
        border-radius: var(--radius-md);
        background: var(--linen);
        border: 2px solid transparent;
        transition: all 0.18s ease;
      }
      .pay-btn span {
        font-size: 10.5px;
        font-weight: 700;
        color: var(--cocoa);
      }
      .pay-btn svg {
        width: 19px;
        height: 19px;
        color: var(--cocoa);
      }
      .pay-btn.selected {
        background: var(--espresso);
        border-color: var(--espresso);
        transform: translateY(-2px);
        box-shadow: var(--shadow-md);
      }
      .pay-btn.selected svg,
      .pay-btn.selected span {
        color: var(--linen);
      }
      .pay-btn:active {
        transform: scale(0.94);
      }

      /* Totales */
      .totals-box {
        padding: 14px 16px 4px;
      }
      .totals-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 13px;
        color: var(--cocoa);
        font-weight: 500;
        padding: 3px 0;
      }
      .totals-row.grand {
        padding-top: 9px;
        margin-top: 6px;
        border-top: 1.5px dashed var(--khaki);
      }
      .totals-row.grand .label {
        font-family: var(--font-title);
        font-size: 16px;
        font-weight: 700;
        color: var(--espresso);
      }
      .totals-row.grand .value {
        font-family: var(--font-title);
        font-size: 21px;
        font-weight: 800;
        color: var(--espresso);
      }

      /* Overlay al expandir carrito */
      .cart-overlay {
        position: fixed;
        inset: 0;
        background: rgba(74, 52, 42, 0.32);
        z-index: 55;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .cart-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }

      /* ==========================================================================
   12. RESPONSIVE - TABLET
   ========================================================================== */
      @media (min-width: 600px) {
        .products-grid {
          grid-template-columns: repeat(3, 1fr);
        }
        .tables-grid {
          grid-template-columns: repeat(4, 1fr);
        }
        .sale-type-grid {
          max-width: 420px;
        }
        body {
          max-width: 640px;
          margin: 0 auto;
        }
        .cart-panel {
          max-width: 640px;
          margin: 0 auto;
        }
        .toast-container {
          max-width: 640px;
          margin: 0 auto;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <!-- ==========================================================================
     BARRA SUPERIOR
     ========================================================================== -->
    <header class="topbar">
      <button class="btn-back ripple-host" id="btnBack" aria-label="Regresar">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
      <div class="topbar-title">
        <h1>Nueva Venta</h1>
        <p id="fechaActual">domingo, 12 de julio</p>
      </div>
      <div class="store-badge">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            d="M3 9l1-5h16l1 5M4 9h16v10a1 1 0 01-1 1H5a1 1 0 01-1-1V9zM9 21v-6h6v6"
          />
        </svg>
      </div>
    </header>

    <main>
      <!-- ==========================================================================
       SELECTOR TIPO DE VENTA
       ========================================================================== -->
      <section class="section">
        <div class="section-label"><h2>Tipo de venta</h2></div>
        <div class="sale-type-grid">
          <button
            class="sale-type-card ripple-host selected"
            id="cardParaLlevar"
            data-type="llevar"
          >
            <div class="sale-type-check">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6L9 17l-5-5" />
              </svg>
            </div>
            <div class="sale-type-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M6 2l1.5 3M18 2l-1.5 3M4 9h16l-1.5 10a2 2 0 01-2 1.8H7.5a2 2 0 01-2-1.8L4 9z"
                />
              </svg>
            </div>
            <h3>Para llevar</h3>
            <span>El cliente compra y se va</span>
          </button>
          <button
            class="sale-type-card ripple-host"
            id="cardMesa"
            data-type="mesa"
          >
            <div class="sale-type-check">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="3"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 6L9 17l-5-5" />
              </svg>
            </div>
            <div class="sale-type-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M3 10h18M5 10v9m14-9v9M3 6h18l-1 4H4l-1-4z" />
              </svg>
            </div>
            <h3>Mesa</h3>
            <span>Consumo en el local</span>
          </button>
        </div>
      </section>

      <!-- ==========================================================================
       BARRA DE CONTEXTO ACTIVO
       ========================================================================== -->
      <div class="context-bar" id="contextBar">
        <div class="context-bar-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 10h18M5 10v9m14-9v9M3 6h18l-1 4H4l-1-4z" />
          </svg>
        </div>
        <div class="context-bar-text">
          <div class="context-bar-title" id="contextBarTitle">Mesa 1</div>
          <div class="context-bar-sub" id="contextBarSub">Cuenta nueva</div>
        </div>
        <button
          class="context-bar-close"
          id="contextBarClose"
          aria-label="Cambiar de mesa"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            stroke-linecap="round"
          >
            <path d="M18 6L6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- ==========================================================================
       SELECTOR DE MESAS (se muestra al elegir "Mesa")
       ========================================================================== -->
      <section class="section">
        <div class="tables-wrap" id="tablesWrap">
          <div class="section-label" style="margin-top: 14px">
            <h2>Selecciona una mesa</h2>
          </div>
          <div class="tables-grid" id="tablesGrid"></div>
        </div>
      </section>

      <!-- ==========================================================================
       FAVORITOS
       ========================================================================== -->
      <section class="section">
        <div class="section-label"><h2>⭐ Favoritos</h2></div>
        <div class="scroll-row" id="favRow"></div>
      </section>

      <!-- ==========================================================================
       CATEGORIAS
       ========================================================================== -->
      <section class="section">
        <div class="scroll-row cat-row" id="catRow"></div>
      </section>

      <!-- ==========================================================================
       BUSCADOR
       ========================================================================== -->
      <div class="search-wrap">
        <div class="search-box">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="7" />
            <path d="M21 21l-4.3-4.3" />
          </svg>
          <input
            type="text"
            id="searchInput"
            placeholder="Buscar producto..."
          />
          <button class="search-clear" id="searchClear">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
            >
              <path d="M18 6L6 18M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- ==========================================================================
       GRID DE PRODUCTOS
       ========================================================================== -->
      <div class="products-grid" id="productsGrid"></div>
    </main>

    <!-- ==========================================================================
     TOAST
     ========================================================================== -->
    <div class="toast-container">
      <div class="toast" id="toast">
        <div class="check-circle">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="3.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6L9 17l-5-5" />
          </svg>
        </div>
        <span id="toastText">Producto agregado</span>
      </div>
    </div>

    <!-- Overlay -->
    <div class="cart-overlay" id="cartOverlay"></div>

    <!-- ==========================================================================
     CARRITO FIJO
     ========================================================================== -->
    <div class="cart-panel" id="cartPanel">
      <div class="cart-handle"></div>
      <div class="cart-summary" id="cartSummary">
        <div class="cart-icon-wrap">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="9" cy="21" r="1" />
            <circle cx="19" cy="21" r="1" />
            <path
              d="M2.5 3h2l2.6 12.4a2 2 0 002 1.6h8.8a2 2 0 002-1.6L21 8H6"
            />
          </svg>
          <div class="cart-badge" id="cartBadge">0</div>
        </div>
        <div class="cart-summary-text">
          <div class="label" id="cartLabel">Carrito vacío</div>
          <div class="amount" id="cartTotal">$ 0</div>
        </div>
        <div class="cart-chevron">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M6 9l6 6 6-6" />
          </svg>
        </div>
        <button class="btn-checkout ripple-host" id="btnCheckout">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M20 6L9 17l-5-5" />
          </svg>
          Cobrar
        </button>
      </div>

      <div class="cart-expanded">
        <div class="cart-scroll" id="cartScroll"></div>

        <div class="pay-section">
          <div class="pay-title">Método de pago</div>
          <div class="pay-grid" id="payGrid"></div>
        </div>

        <div class="totals-box">
          <div class="totals-row">
            <span>Subtotal</span><span id="subtotalValue">$ 0</span>
          </div>
          <div class="totals-row grand">
            <span class="label">Total</span
            ><span class="value" id="grandTotalValue">$ 0</span>
          </div>
        </div>
      </div>
    </div>

    <script src="../services/auth.service.js"></script>
    <script type="module" src="js/ventas.js"></script>  
  </body>
  
</html>
